<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Danush Vikraman · Quantum Engineer</title>
  <meta name="description" content="Danush Vikraman — Quantum Engineer, Researcher & Inventor. Quantum algorithms, NISQ hardware, and machine learning. PES University, Bengaluru.">
  <meta name="theme-color" content="#050505">

  <!-- ═══ GitHub target for one-click publishing (edit if repo changes) ═══ -->
  <meta name="github-owner" content="DanushVikraman007">
  <meta name="github-repo" content="danushvikraman-">
  <meta name="github-branch" content="main">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/admin.css">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛</text></svg>">
</head>
<body>
  <!-- Ambient layers -->
  <canvas id="field" aria-hidden="true"></canvas>
  <div id="noise" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true"></div>

  <main id="app">
    <!-- ═════════ SPACE 1 · HOME ═════════ -->
    <section class="space" id="home" data-state="active">
      <nav class="bar">
        <a class="brand" href="#" data-home>
          <span class="brand-mark">D·V</span>
          <span class="brand-status" id="brand-status">ONLINE</span>
        </a>
        <div class="bar-actions">
          <button class="icon-btn" data-studio-toggle title="Theme studio" aria-label="Theme studio">◐</button>
          <button class="icon-btn" data-edit-toggle title="Edit mode" aria-label="Edit mode">✎</button>
        </div>
      </nav>

      <div id="home-content">
        <div class="hero">
          <div class="hero-text" id="hero-text"><!-- rendered from JSON --></div>

          <aside class="instrument" aria-label="Interactive atom">
            <div class="instrument-chassis">
              <canvas id="atom"></canvas>
              <span class="hud-corner tl"></span><span class="hud-corner tr"></span>
              <span class="hud-corner bl"></span><span class="hud-corner br"></span>
              <div class="hud-readout" id="hud-tl"></div>
              <div class="hud-readout" id="hud-tr"></div>
              <div class="hud-readout" id="hud-bl"></div>
            </div>
            <div class="instrument-caption">
              <span class="rule"></span>
              <span class="eq" id="hero-eq"></span>
              <span class="rule"></span>
            </div>
          </aside>
        </div>

        <div class="grid-head rise" style="animation-delay:.5s">
          <span class="label">Modules</span>
          <span class="rule"></span>
        </div>
        <div class="modules" id="modules"><!-- rendered from JSON --></div>
      </div>

      <footer class="foot" id="foot"></footer>
    </section>

    <!-- ═════════ SPACE 2 · DETAIL ═════════ -->
    <section class="space" id="detail" data-state="right">
      <nav class="bar">
        <button class="ghost-btn" data-back>← Index</button>
        <span class="crumb" id="crumb"></span>
        <div class="bar-actions">
          <button class="icon-btn" data-console title="Admin console" aria-label="Admin console">⌘</button>
          <button class="icon-btn" data-studio-toggle title="Theme studio" aria-label="Theme studio">◐</button>
          <button class="icon-btn" data-edit-toggle title="Edit mode" aria-label="Edit mode">✎</button>
        </div>
      </nav>
      <div id="detail-body"></div>
    </section>
  </main>

  <!-- Edit mode bar -->
  <div class="edit-bar" role="toolbar">
    <span class="dot"></span>
    <span id="edit-status">Edit mode · click any text to amend</span>
    <button class="btn quiet" data-console>Console</button>
    <button class="btn quiet" data-export>Export</button>
    <button class="btn primary" data-publish>Publish</button>
    <button class="btn quiet" data-exit>✕</button>
  </div>

  <!-- Dynamic modal (admin console, editors, auth) -->
  <div class="overlay" id="dyn-overlay"><div class="sheet"></div></div>

  <!-- Theme studio -->
  <aside class="studio" id="theme-studio" aria-label="Theme studio">
    <div class="studio-head">
      <div class="studio-title">Theme studio</div>
      <button class="ghost-btn studio-back" data-studio-close type="button" aria-label="Close theme studio">← Back</button>
    </div>
    <div class="studio-body">
      <p class="studio-sub">Changes preview instantly. Publish (in edit mode) to make them permanent for every visitor.</p>
      <div class="studio-label">Presets</div>
      <div class="presets" id="presets"></div>
      <div class="studio-label">Accent</div>
      <div class="swatches" id="sw-accent"></div>
      <div class="studio-label">Background</div>
      <div class="swatches" id="sw-bg"></div>
      <div class="studio-label">Typeface</div>
      <div class="font-opts" id="font-opts"></div>
      <div class="studio-label">Mode</div>
      <div class="mode-toggle" id="mode-toggle"></div>
    </div>
  </aside>

  <script type="module" src="js/main.js"></script>
</body>
</html>
